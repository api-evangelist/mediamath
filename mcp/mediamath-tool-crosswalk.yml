rest_only:
  summary: >-
    The Agent Connector covers roughly 60 of 353 published REST operationIds.
    Whole product areas have no tool at all.
  areas:
    - area: Audit logs
      note: Every entity exposes an audit-log operation (organization-audit-log, agency-audit-log, advertiser-audit-log, campaign-audit-log, concepts-audit-log, atomic-creative-audit-log, segment-groups-audit-log, and bulk variants). No MCP tool reads them.
    - area: Contracts and vendor contracts
      note: list-vendor-contracts, list-contracts and the fee/rebate model behind them have no tool.
    - area: Bid Request Firehose (BOF Config API)
      note: 13 operations across consumer configuration, channel-type filters and geo filters. No tool.
    - area: BYOA / Custom Bid Router
      note: 14 operations on api.byoa.mediamath.com covering executors, endpoints, campaign settings and Custom Brain. No tool, despite BYOA being the platform's algorithmic differentiator.
    - area: Component Creatives API
      note: 27 operations. No tool.
    - area: Currency rates, timezones, verticals, enterprise controls
      note: Reference/static-data collections used to validate campaign and strategy payloads. No tools, so an agent must guess valid values or fail on write.
    - area: Reporting API V1
      note: 30 GET report operations plus per-report /meta. The Agent Connector exposes six curated report tools instead.
    - area: Creative classification and IAB static data
      note: Video Creatives API classification/v1.0 and static_data/v1.0 operations have no tool.

