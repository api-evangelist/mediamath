mcp_only:
  - tool: healthcheck
    reason: MCP transport health probe, not a platform resource.
  - tool: mmas_creative_upload
    reason: >-
      Interactive file-picker mode renders an MCP App (ui://display-creative-upload)
      and streams file bytes as base64 over the MCP connection. There is no REST
      equivalent for the in-browser upload path.
  - tool: mmas_creative_video_upload
    reason: >-
      Same MCP App pattern (ui://video-creative-upload). Only the public-URL mode
      has a REST analogue.
