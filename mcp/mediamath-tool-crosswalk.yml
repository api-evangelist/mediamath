source: >-
  mcp/mediamath-mcp.yml, https://apidocs.mediamath.com/guides/mcp/tool-reference,
  openapi/*.yml (353 operationIds across 44 documents), graphql/mediamath-schema.graphql
note: >-
  Binds each Infillion Agent Connector MCP tool to the MediaMath REST
  operationId(s) that back it. The Agent Connector is CLOSED BETA and its
  endpoint is not published, so a live tools/list could not be run against it;
  every binding below is mapped by tool name and by the semantics in the
  provider's own Tool Reference against operationIds verified present in
  openapi/. Confidence is set accordingly and is never "high" unless the tool
  name, the documented behaviour and the REST operation all agree.
  The documentation MCP server (https://apidocs.mediamath.com/mcp) is a
  meta-surface over the specs themselves — it exposes no business operations and
  is therefore listed under mcp_only[] rather than crosswalked.

