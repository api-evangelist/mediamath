  update:
    x-conventions:
      idempotency:
        supported: false
        note: No Idempotency-Key header or client-supplied request key is documented anywhere in the MediaMath
          developer documentation. Read back before retrying a create.
      error_envelope: '{"meta":{"status":"error","uuid":"..."},"errors":[{"code":"...","message":"...","details":{}}]}'
      rate_limit_headers:
      - X-RateLimit-Limit
      - X-RateLimit-Remaining
      - X-RateLimit-Reset
      - X-Concurrency-Limit
      - X-Concurrency-Remaining
      - Retry-After
      rate_limit_note: Header values are per-pod (5 production pods); documented safe sustained rate is
        40 req/s cluster-wide.
      pagination:
        style: offset
        params:
        - page_limit
        - page_offset
        - sort_by
        - q
      update_method: POST (not PUT/PATCH)
      bulk_partial_success: HTTP 207 Multi-Status
