- name: MediaMath Audience Onboarding API
  description: >-
    API for ingesting audience event data into the MediaMath Platform via real-time server-side pixel
    events and batch event uploads. Supports UUID, mobile advertising IDs, and CTV device IDs for cross-device
    audience building and segment management.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://apidocs.mediamath.com/guides/audience-onboarding
  baseURL: https://ingest-default.prod.octane.mediamath.com
