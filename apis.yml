    In Customized Brain, the client uses the BYOA API to upload a set of logistic coefficients corresponding
    to any of the variables currently in use by the MediaMath Brain. These coefficients will then be used
    by participating strategies to calculate the predicted response rate for each impression. The bidder
    will calculate bid price by multiplying the predicted response rate by the strategy's goal value.
    Goal values can be modified using the T1 campaign management API.
