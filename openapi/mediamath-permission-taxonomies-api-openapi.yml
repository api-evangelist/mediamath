                    advertisers:
                      type: array
                      items:
                        type: integer
                    agencies:
                      type: array
                      items:
                        type: integer
                    organizations:
                      type: array
                      items:
                        type: integer
                taxonomy:
                  type: object
                  properties:
                    children:
                      type: array
                      items:
                        type: object
                        properties:
                          buyable:
                            type: boolean
                          children:
                            type: array
