components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.mediamath.com/oauth/token
          scopes: {}
    Cookie_Auth:
      type: apiKey
      description: 'Cookie: adama_sesion=`cookie-id`. Security: API Key - Please note that adama_cookie support is being deprecated and will be removed in our future v2 API.'
      name: Cookie
      in: header
