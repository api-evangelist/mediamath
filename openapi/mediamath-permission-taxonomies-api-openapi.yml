                          id:
                            type: integer
                          name:
                            type: string
                    description:
                      type: string
                    id:
                      type: integer
                  required:
                  - children
                use_hash:
                  type: boolean
                  description: If you are using a segment **code** that is not a 32-bit integer, you'd have to pass an optional parameter *use_hash:true* as part of the JSON body.
                  default: false
              required:
              - audience_vendor_id
              - taxonomy
              x-examples:
