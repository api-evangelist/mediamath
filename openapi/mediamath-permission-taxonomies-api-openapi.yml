    post:
      tags:
      - Permission Taxonomies
      summary: Update Permission Taxonomy
      description: 'With a taxonomy ID (obtained from creating a new taxonomy), you can update the taxonomy, change permissions, and add or remove audience segments.


        **NOTE: you must always post the entire taxonomy when updating a taxonomy.**


        To ensure that the entire taxonomy is correct, we recommend updates be done as a 3-step process:

        1. GET the existing taxonomy (see example API response with definitions)

        2. Identify & make changes (i.e. add/edit permissions, add/remove leaf nodes, change retail CPMs, etc)

        3. POST the updated taxonomy'
      operationId: POST_audience_segments-taxonomy_id
      parameters:
      - name: taxonomy_id
        in: path
        description: taxonomy_id
        required: true
        schema:
          type: string
      - name: Content-Type
        in: header
        description: _
        required: true
        schema:
          type: string
