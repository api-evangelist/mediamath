openapi: 3.2.0
info:
  title: Audience Segments Permission Taxonomies API
  description: '{% admonition type="danger" name="This API is deprecated as of 1st August 2026" %}

    The functionality has been built into the V3 Campaign Management API docs which can be found here: https://apidocs.mediamath.com/apis/campaigns-api/openapi

    {% /admonition %}

    Using the Audience Segments API, customers and data providers have control to onboard and activate the data they need to target in MediaMath Platform. As it''s a self-service solution, turnaround time for updates is reduced from business days to minutes. The API is built using industry standard, open source REST APIs and is a scaleable way to handle all requests for both global and permissioned taxonomies. The service brings transparency to data activation at MediaMath, allowing customers and data providers oversight of relevant 1st and 3rd party audience data sets as well as the permissioning of those data sets. # Audience Segments & Taxonomies


    There are two ways to expose the data onboarded via server-to-server within MediaMath Platform:

    * **Taxonomies**

    * These can be global, meaning all MediaMath customers will have access to the segments within the taxonomy in MediaMath Platform. * These can be permissioned so that only select MediaMath customers have access to the segments within the taxonomy in MediaMath Platform. * **External Data Segments**

    * These represent a single segment and are always permissioned. * These are also referred to as Data Pixels. It''s possible to use both methods to achieve a mix of global and permissioned taxonomies & external data segments to suit your needs and the needs of your customers. Note: The S2S data transfer is the same for both global and permissioned taxonomies, as well as external data segments. ## Taxonomies (Global)


    Taxonomies are presented in MediaMath Platform as a hierarchical tree, where the first node (root node) is the data provider''s name. Within the tree, media traders can expand selections of categories of segments and view an estimated audience size (the number of unique users) and a CPM price (USD by default). In this view, the Audience Targeting view has been annotated to show the elements of a taxonomy:


    !Audience Tab Annotated


    ## Taxonomies (Permissioned)

    Similar to global taxonomies, permissioned taxonomies are also presented in MediaMath Platform as a hierarchical tree, where the first node (root node) is the data provider''s name. Within the tree, media traders can expand selections of categories of segments and view an estimated audience size (the number of unique users) and a CPM price (USD by default). Permissioned taxonomies can include first and/or third party segments and are ''permissioned'' or shared with specified entities, organizations, agencies and/or advertisers in MediaMath Platform. As all taxonomy management utilizes the same underlying MediaMath API, the information shared in this section applies to both global and permissioned taxonomies, with the exception of the visibility of the taxonomy & permissioning. ### Revenue Share at Taxonomy Level

    Utilizing the API requires the data provider be set up as a data vendor in our system and that MediaMath act as a clearinghouse for all transactions. For third-party data providers, you''ll work out terms with our partnerships team; for customers sharing first-party data, the revenue share will typically be set at 0 by our partnerships team. Each data provider has a default revenue share, mutually agreed upon with the partnerships team; however, this default revenue share value can be overridden at a taxonomy level. For example, if a customer wants to target segments in MediaMath Platform at a rate which they have pre-negotiated with you, their data vendor, the customer''s specific rate may require the use of a revenue share different from the default revenue share originally agreed upon between you & MediaMath.'
