tags:
- name: Video Creative Management (V2)
  description: V2.0 video creative endpoints (legacy)
- name: Video Creative Management (V3)
  description: V3.0 video creative management endpoints
- name: Classification (V1.0 - Deprecated)
  description: "{% admonition type=\"danger\" name=\"This API is deprecated and will be removed in July\
    \ 2026\" %}\n  Please migrate to the **Classification API v3.0** documented below.\n{% /admonition\
    \ %}\n\n{% admonition type=\"warning\" name=\"Notice about authentication with cookie adama_session\"\
    \ %}\n  The use of cookie `adama_session` for authentication has been discontinued and it's not supported\
    \ in Classification API v3.0.\n  We ask all of our clients who have not yet migrated to **Bearer (JWT)\
    \ Authentication** to do so as soon as possible.\n{% /admonition %}\n\nCreative classification endpoints\
    \ (V1.0 — deprecated).\n"
- name: Classification (V3)
  description: V3.0 creative classification endpoints. Uses Bearer (JWT) authentication.
- name: IAB (V1.0 - Deprecated)
  description: "{% admonition type=\"danger\" name=\"This API is deprecated and will be removed in July\
    \ 2026\" %}\n  Please migrate to the **IAB Data API v3.0** (`GET /v3.0/static_data/{category}`) documented\
    \ below.\n{% /admonition %}\n\n{% admonition type=\"warning\" name=\"Notice about authentication with\
    \ cookie adama_session\" %}\n  The use of cookie `adama_session` for authentication has been discontinued\
    \ and it's not supported in V3.0.\n  We ask all of our clients who have not yet migrated to **Bearer\
    \ (JWT) Authentication** to do so as soon as possible.\n{% /admonition %}\n\nIAB static data endpoints\
    \ (V1.0 — deprecated).\n"
- name: IAB Data (V3)
  description: 'V3.0 IAB data endpoints. A single pair of endpoints serves all categories

    (`iab_verticals`, `iab_attributes`, `language`). Uses Bearer (JWT) authentication.

    '
servers:
- url: https://api.mediamath.com
components:
  parameters:
    trait_cookieAuth_Cookie:
      name: Cookie
      in: header
      description: _
      required: true
      schema:
        type: string
        default: adama_session=<<sessionid>>
    trait_jsonResponse_Accept:
      name: Accept
      in: header
      description: _
      required: false
      schema:
        type: string
        default: application/vnd.mediamath.v1+json
    trait_oAuth2Jwt_Authorization:
      name: Authorization
      in: header
      description: The OAuth2 token. See https://mediamath-auth.api-docs.io/v2/oauth2/oauth2-api-access
        for more information.
      required: true
      schema:
        type: string
        pattern: Bearer .*
    trait_limit_page_limit:
      name: page_limit
      in: query
      description: _
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
    trait_limit_page_offset:
      name: page_offset
      in: query
      description: Index of the first element in the collection to retrieve
      required: false
      schema:
        type: integer
    trait_querying_q:
      name: q
      in: query
      description: _
      required: false
      schema:
        type: string
    trait_returnAdditionalEntityProperties_full:
      name: full
      in: query
      description: To include all properties for all entities returned by the API call, use `full=*:`
      required: false
      schema:
        type: string
        default: ''
    trait_returnAdditionalEntityProperties_with:
      name: with
      in: query
      description: _
      required: false
      schema:
        type: string
    trait_sorting_sort_by:
      name: sort_by
      in: query
      description: name
      required: false
      schema:
        type: string
  requestBodies:
    POST_video-v2-0-creatives-validateVASTBody:
      content:
        text/plain:
          schema:
            type: string
      description: VAST XML content to validate
    ModifyCompanionRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ModifyCompanionRequest'
      description: Companion ad details
      required: true
    GET_static_data-v1-0-language-language_idBody:
      content:
        application/json:
          schema: {}
      description: _
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        password:
          tokenUrl: https://auth.mediamath.com
          scopes: {}
  schemas:
    ModifyCompanionRequest:
      type: object
      required:
      - details
      properties:
        details:
          $ref: '#/components/schemas/CompanionDetails'
        fileExtension:
          type: string
          description: File extension
        fileName:
          type: string
          description: File name
        resourceUrl:
          type: string
          description: Resource URL for all other companion types
        resourceData:
          type: string
          description: Resource data encoded in Data URI Scheme for static companion types
    CompanionDetails:
      type: object
      required:
      - adServer
      - typ
      - width
      - height
      - landingUrl
      properties:
        adServer:
          type: string
          description: AdServer tag name
        typ:
          type: string
          description: Companion type (static, iframe, or html)
          enum:
          - static
          - iframe
          - html
        width:
          type: integer
          minimum: 32
          maximum: 10000
          description: Width in pixels
        height:
          type: integer
          minimum: 32
          maximum: 10000
          description: Height in pixels
        landingUrl:
          type: string
          description: Declared landing URL
        iFrameUrlOrHTML:
          type: string
          description: iFrame URL (for iframe type) or HTML content (for html type)
        clickthroughUrl:
          type: string
          description: Clickthrough URL (required for static companions; must be null for iframe/html)
    ValidateVASTResponse:
      type: object
      properties:
        error:
          type: string
          description: VAST validation error message, omitted if no errors present
        warnings:
          type: array
          items:
            type: string
          uniqueItems: true
          description: A set of VAST validation warnings
    CreativeStatusResponse:
      type: object
      properties:
        uploadInfo:
          $ref: '#/components/schemas/FileInfo'
        encodingStatus:
          $ref: '#/components/schemas/GetStatusResponse'
    FileInfo:
      type: object
      properties:
        status:
          type: string
          description: Upload status
        size:
          type: integer
          format: int64
          description: File size in bytes
        percent:
          type: number
          description: Upload percent complete (0-100)
          default: 0
        name:
          type: string
          description: File name
        path:
          type: string
          description: File path
        mirrorPath:
          type: array
          items:
            type: string
          description: Mirror paths (asset URLs)
        hash:
          type: string
          description: File hash
    GetStatusResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EncodingStatus'
        percent:
          type: number
          description: Overall encoding progress (0-100)
        encodings:
          type: array
          items:
            $ref: '#/components/schemas/GetStatusResponse_Encoding'
    GetStatusResponse_Encoding:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EncodingStatus'
        percent:
          type: number
          description: Encoding progress (0-100)
        id:
          type: integer
          format: int64
          description: Encoding ID
        statusMessage:
          type: string
          description: Status message (e.g. error details)
    GetCreativeVariantsResponse:
      type: object
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/LegacyEncoding'
    LegacyEncoding:
      type: object
      properties:
        videoCodec:
          type: string
        audioCodec:
          type: string
        width:
          type: integer
        height:
          type: integer
        bitrateKbps:
          type: integer
        format:
          type: string
        id:
          type: integer
        contentMd5:
          type: string
        outputUrl:
          type: string
          description: Asset URL
        encode:
          type: boolean
          default: true
        status:
          $ref: '#/components/schemas/EncodingStatus'
        percent:
          type: number
          description: Encoding progress (0-100)
        currentEvent:
          type: string
        currentEventPercent:
          type: number
        s3ResourceName:
          type: string
        stored:
          type: boolean
        active:
          type: boolean
        copiedUrl:
          type: string
          description: Asset URL (copied)
        sizeBytes:
          type: integer
          default: -1
        errorMessage:
          type: string
    CompanionAd:
      type: object
      properties:
        id:
          type: integer
          description: Companion ID
        details:
          $ref: '#/components/schemas/CompanionDetails'
        fileExtension:
          type: string
        mimeType:
          type: string
        fileName:
          type: string
        resourceBlob:
          type: string
          description: Data blob used for images
        resourceUrl:
          type: string
          description: URL for external resources
    CompanionsResponse:
      type: object
      properties:
        companions:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/CompanionAd'
          description: Map of companion ID (string) to companion details
    CreateCompanionResponse:
      type: object
      properties:
        companionId:
          type: integer
    ErrorInfoList:
      type: object
      properties:
        field_error:
          type: array
          items:
            $ref: '#/components/schemas/ErrorInfo'
    ErrorInfo:
      type: object
      properties:
        error:
          type: string
        index:
          type: integer
          description: Index in bulk request (for bulk operations)
        code:
          type: string
        name:
          type: string
        field:
          type: string
    EncodingStatus:
      type: string
      enum:
      - Pending
      - Processing
      - Finished
      - Waiting
      - Storing
      - Details
      - Error
    V3CreateCreativeRequest:
      type: object
      required:
      - advertiser
      - name
      - concept
      properties:
        active:
          type: boolean
          default: false
        advertiser:
          type: integer
          format: int64
          description: T1 Advertiser ID
        name:
          type: string
          maxLength: 256
          description: Creative name (required, max 256 chars)
        concept:
          type: integer
          format: int64
          description: T1 Concept ID (mandatory for creation)
        startTime:
          type: integer
          format: int64
          description: Creative start date (Unix timestamp, must be >= 0 and < year 10000)
        endTime:
          type: integer
          format: int64
