        in: path
        description: Video ID
        required: true
        schema:
          type: integer
      - name: companion_id
        in: path
        description: Companion ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Companion deleted successfully
        '404':
          description: Creative or companion not found
