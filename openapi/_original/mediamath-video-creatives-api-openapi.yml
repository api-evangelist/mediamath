        customVASTUrl:
          type: string
          description: URL to VAST XML content (mutually exclusive with customVAST)
        viewabilityTemplate:
          type: string
          description: VAST XML template for BYOT viewability (must contain __VPAID_AD_PARAMETERS.URL__
            macro)
