  /v3.0/creatives:
    post:
      tags:
      - Video Creative Management (V3)
      summary: Create a new video creative
      description: "Create a new video creative - V3.\n\n### Uploading a video file\n\nTo upload a video,\
        \ supply the `fileName` field in the request body\n(see the **Create with fileName** sample in\
        \ the *Request samples* panel).\nThe response then includes a pre-signed S3 `uploadUrl` (valid\
        \ for\n`expiresIn` seconds), which the client uses to `PUT` the file directly to S3:\n\n```bash\n\
        curl -X PUT \\\n    -H \"x-amz-acl: public-read\" \\\n    -H \"x-amz-meta-creative: {{CREATIVE_ID}}\"\
        \ \\\n    -H \"Content-Type: {{UPLOADED_FILE_CONTENT_TYPE}}\" \\\n    --upload-file \"{{UPLOADED_FILE_PATH/File.mp4}}\"\
        \ \\\n    \"{{S3_PRESIGNED_URL}}\"\n```\n\nThe `x-amz-acl: public-read` and `x-amz-meta-creative:\
        \ <creativeId>` headers\nare required (both are signed into the pre-signed URL).\n"
      operationId: POST_v3-0-creatives
      x-codeSamples:
      - lang: cURL
        label: Create with fileName (video upload)
        source: "curl --location 'https://api.mediamath.com/video/v3.0/creatives' \\\n--header 'Authorization:\
          \ Bearer TOKEN' \\\n--header 'Content-Type: application/json' \\\n--data '{\n  \"active\": false,\n\
          \  \"advertiser\": 0,\n  \"name\": \"string\",\n  \"concept\": 0,\n  \"startTime\": 0,\n  \"\
          endTime\": 0,\n  \"clickthroughUrl\": \"string\",\n  \"viewabilityTemplate\": \"string\",\n\
          \  \"landingUrl\": \"string\",\n  \"eventPixels\": [\n    {\n      \"typ\": \"string\",\n  \
          \    \"url\": \"string\"\n    }\n  ],\n  \"vendors\": [\n    0\n  ],\n  \"vastVersion\": \"\
          VAST2\",\n  \"disabledVariants\": [\n    0\n  ],\n  \"clockNumber\": \"string\",\n  \"fileName\"\
          : \"string\"\n}'\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3CreateCreativeRequest'
        description: Creative object to create
      responses:
        '201':
          description: Creative created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewCreativeResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfoList'
