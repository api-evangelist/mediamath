  /brain_feature_summary/meta:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
      summary: Brain Feature Summary report
      description: "{% admonition type=\"danger\" name=\"This API is deprecated and will be removed in July 2026\" %}\n  The new API docs can be found here: [https://apidocs.mediamath.com/apis/reporting-api](https://apidocs.mediamath.com/apis/reporting-api)\n{% /admonition %}\n\n## The Brain Feature Summary report\n\nSample usage: GET https://api.mediamath.com/reporting/v1/std/brain_feature_summary/meta?v1\n\n### Background\n\nThe Brain Feature Summary report provides transparency into how the Brain optimizes.  The Brain Feature Summary Report centralizes impression features, such as Exchange, Site, Creative Size or Day of Week, that have the largest predictive impact.  Features are a column of dataset used as an input to the model. For example; device_model, day_of_week or browser. Descriptions of Current Brain Features are available [here](https://apidocs.mediamath.com/byoa/custom-brain/available-features).  Feature values are not listed in the report. This report gives you transparency into the importance of each Brain Feature at the aggregated level.\n\nThe information in this report is provided when a new Brain model is generated, but some days in the reporting period may be missing (which is normal). Depending on the training data, we may not always generate a new model so you may see gaps (not all days will generate the report). The report time rollups are updated daily, typically before 18:00 UTC. The data contained for the date in the report will be for the latest model picked up on that day and loaded into reporting.  Retention is on a rolling 30 days, with a date range therefore of up to 30 days.  T1 continues to train Brain models just in case the campaign is set live again, maximizing your opportunity to take advantage of the Brain Optimization on spend. Once there is no more training data (after 23 days of no activity) T1 will stop generating new models until spend recommences.\n\nThe information included in the Brain Feature Summary report is not relevant in the following circumstances:\n* Campaigns powered by a Custom Brain\n* CPA/ROI strategies within a campaign using 3rd-party attribution\n* CPA strategies within a campaign with post-view attribution discounted below 100%\n\n### How to run a Brain Feature Summary report via T1 instead of by API:\n1. Navigate to the Reports module\n2. Click on the Data Export tab\n3. Type the name of the report in the File Name field\n4. Select the Brain Feature Summary report from the Report Type drop-down list\n5. Select the date range you want your report to cover\n6. Select Agency, Advertiser and Campaign from the relevant drop-down lists\n7. Select your preferred Dimensions\n\n### The Brain Feature Summary report itself\nThis report exports multiple campaigns and Goal Types at once.\n\n### Sample CSV view of a Brain Feature Summary report\n\n| | A | B | C | D | E | F | G | H | I |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | start_date | end_date | organization_id | advertiser_id | agency_id | campaign_id | model_goal | feature |\n| 2 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | category_id |\n| 3 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | id_vintage |\n| 4 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | week_part |\n| 5 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | exchange_viewability_rate |\n| 6 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | region_id |\n| 7 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | conn_speed |\n| 8 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | day_of_week |\n| 9 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | browser_version |\n| 10 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | site_id |\n| 11 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | exchange_id_cs_site_id |\n| 12 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | day_part |\n| 13 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | dma_id |\n| 14 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | deal_id |\n| 15 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | os_id |\n\n### What's in the Brain Feature Summary report\n| Column | Example* | Description |\n|---|---|---|\n| Start Date | 8/31/2019 | Date when these values were being used in bidding. |\n| End Date | 8/31/2019 | Date when these values were being used in bidding. |\n| Organization ID | 100001 | |\n| Agency ID | 10002 |\n| Advertiser ID | 10003 |\n| Campaign ID | 111111 | MediaMath unique ID for campaign. |\n| Model Goal | CPA, ROI, CPC, etc. | The Goal Type that the model was trained for. Each Goal Type will have a different Brain model. |\n| Feature |isp_id, day_of_week, size, week_part, category_id | The Dimension used as input into the Brain Machine Learning model. For a full list, see [here](https://apidocs.mediamath.com/byoa/custom-brain/available-features). |\n| Position | 0, 1, 2, 3, 4, ..., 99 | For bottom_features, a Position of 0 means it had the lowest \"Mean\".  For top_features, a Position of 0 means it had the highest \"Mean\". |\n| Index | 2.1925095 | The index column gives you a comparative indication of the relative importance of features based on normalized attribution, at an aggregated level. While the values might not make much sense for a global understanding of the model, the index gives an indication of what the model sees as important features when its trained. The higher the Index number, the higher the importance. |\n\n*Note: Only 1 value will appear, not a comma-delimited list, although feature_value may be a pipe-delimited list)\n"
      operationId: Generate-Brain-Feature-Summary-report
      tags:
      - Reports
  /brain_feature_value/meta:
    get:
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
      summary: Brain Feature Value report
      operationId: Generate-Brain-Feature-Value-report
      tags:
      - Reports
      description: "{% admonition type=\"danger\" name=\"This API is deprecated and will be removed in July 2026\" %}\n  The new API docs can be found here: [https://apidocs.mediamath.com/apis/reporting-api](https://apidocs.mediamath.com/apis/reporting-api)\n{% /admonition %}\n\n## Brain Feature Value Report\n\nSample usage: GET https://api.mediamath.com/reporting/v1/std/brain_feature_value/meta?v1\n\n### Background\nThe Brain Feature Value report gives you transparency into the top 100 and bottom 100 feature values (e.g. site A, creative 123, exchange 1) that impact predictions for each optimization Goal Type (for example, ROI, CPA, VCR).  This shows how each Brain Feature Value directly influences and informs impression prediction and pricing.  Descriptions of Current Brain Features themselves are available [here](https://apidocs.mediamath.com/byoa/custom-brain/available-features). When T1 generates a Brain, there can be 200K+ predictions for Feature Values. To make these predictions more accessible, T1 selects the top 100 and bottom 100 Feature Values (which can vary daily) generated for that day for your viewing per optimization goal.\n\nThe information in this report is provided when a new Brain model is generated, but some days in the reporting period may be missing (which is normal). Depending on the training data, we may not always generate a new model so you may see gaps (not all days will generate the report). The report time rollups are updated daily, typically before 18:00 UTC. The data contained for the date in the report will be for the latest model picked up on that day and loaded into reporting.  Retention is on a rolling 30 days, with a date range therefore of up to 30 days.  T1 continues to train Brain models just in case the campaign is set live again, maximizing your opportunity to take advantage of the Brain Optimization on spend. Once there is no more training data (after 23 days of no activity) T1 will stop generating new models until spend recommences.\n\nThe information included in the Brain Feature Value report is not relevant in the following circumstances:\n* Campaigns powered by a Custom Brain (for more on Custom Brain see [here](https://apidocs.mediamath.com/byoa/custom-brain/about))\n* CPA/ROI strategies within a campaign using 3rd-party attribution\n* CPA strategies within a campaign with post-view attribution discounted below 100%\n\n### How to run a Brain Feature Value report via T1 instead of by API:\n1. Navigate to the Reports module\n2. Click on the Data Export tab\n3. Type the name of the report in the File Name field\n4. Select the Brain Feature Value report from the Report Type drop-down list\n5. Select the date range you want your report to cover\n6. Select Agency, Advertiser and Campaign from the relevant drop-down lists\n7. Select your preferred Dimensions\n\n### The Brain Feature Value report itself\nThis report exports multiple campaigns and Goal Types at once.\n\n### Sample CSV view of a Brain Feature Value report\n| | A | B | C | D | E | F | G | H | I |\n|---|---|---|---|---|---|---|---|---|---|---|\n| 1 | start_date | end_date | organization_id | advertiser_id | agency_id | campaign_id | model_goal | feature_report_type | feature |\n| 2 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  conn_speed |\n| 3 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  exchange_id |\n| 4 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  dma_id |\n| 5 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  fold_position |\n| 6 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  size |\n| 7 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  os |\n| 8 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | top_features |  site_id |\n| 9 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  id_vintage |\n| 10 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  region_id |\n| 11 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  day_of_week |\n| 12 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  size |\n| 13 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  device_id |\n| 14 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  channel_type |\n| 15 | 10/8/2019 | 10/8/2019 | 100001 | 10002 | 10003 | 111111 | cpa | bottom_features |  country_id |\n\n### What's in the Brain Feature Value report\n\n| Column | Example* | Description |\n|---|---|---|\n| Start Date | 8/31/2019 | Date when these values were being used in bidding. |\n| End Date | 8/31/2019\\t| Date when these values were being used in bidding. |\n| Organization ID | 100000 | |\n| Agency ID | 10001 | User-specified (Step 6, below). |\n| Advertiser ID | 20000 | User-specified (Step 6, below). |\n| Campaign ID | 30000 | MediaMath unique ID for campaign. User-specified (Step 6, below). |\n| Model Goal | CPA, ROI, CPC, etc | The Goal Type that the model was trained for. Each Goal Type will have a different Brain model. |\n| Feature Report Type | bottom_features or \ntop_feature | bottom_features: a feature value that was in the bottom 100 (lowest \\\"Mean\\\").  top_features: a feature value that as in the top 100 (highest \\\"Mean\\\") |\n| Position | 0, 1, 2, 3, 4, ..., 9 | For bottom_features, a Position of 0 means it had the lowest \\\"Mean\\\".  For top_features, a Position of 0 means it had the highest \\\"Mean\\\". |\n| Feature | isp_id, day_of_week, size | The Feature that the next column’s Feature Value belongs to, used as input into the Brain Machine Learning model. For a full Feature list, see [here](https://apidocs.mediamath.com/campaigns/byoa/custom-brain/available-features). |\n| Feature Value| Verizon, Tuesday, 728x90 | Readable name of the Feature Value. Some Feature Values display in the report as hashed or otherwise manipulated in a way that does not accurately map back to a human-readable name, fields including Site ID, Category ID, and Region ID. In Q1 2020 or later, we hope to change the hashing to return these back to human readable names but until then it is in the backlog. Please provide feedback if you would find this an important feature to support sooner. The pipe character 'I' indicating that hashing has been applied may occur when there is a large number of Feature Values in a given Feature.  For example; site_id: \\\"539409862I130821751I231186\\\" or isp_id: \\\"WindstreamITelefonica\\\" |\n| Is Numeric | Y, N | A few of the Features (data types used in the prediction) are numerical in nature and will have a different impact on the prediction depending on the actual number (Y = Yes, it is numeric; N = No, it isn't numeric). One example is \\\"id_vintage\\\" which represents how long we’ve had an ID for the particular user we’re trying to predict the Response Rate for. Longer time means better quality (as they don't clear cookies/cache etc.) and improves the odds of conversions. The \\\"id_vintage\\\" field simplifies the large time spectrum into 4 specific ranges. |\n| Index | 123.855316, -60.73726 | This is based on the Mean. The index column gives you a comparative indication of the relative importance of features based on normalized attribution. While the mean values might not make much sense for a global understanding of the model, the index gives an indication of what the model sees as important features when its trained. The higher the Index number, the higher the importance. |\n| Mean | 0.00000648, -0.00000308 | When we train a model, we run a sample of the available data through our proprietary machine learning algorithm. The mean shown in this report is the Mean Attribution of the feature across samples of attribution. While technical, it may interest Data Science users. For the layman, it describes the \\\"average\\\" contribution of that Feature Value to the Predicted Response Rate. |\n| Bid Impact | 1.27748963, 0.93687577 | The marginal multiplicative contribution (> 1.0 increases, > 1.0 decreases) of a feature value (e.g. a particular exchange or site or creative) to a Predicted Response Rate (norm_rr).  The bid_impact is helpful for understanding pricing impact on that feature value, and to calculate CPM. An oversimplification: the baseline score is also impacted by a calibration coefficient. ***normrr = [campaign baseline score] x [bid impact of feature value #1] x [bid impact of feature value #2] …* *CPM = normrr x [strategy’s goal value] x 1,000*** T1 logs the predicted Action Rate of specific impressions in the Log Level Data Service under a field called “norm_rr”. Please speak to your MediaMath Account representative for more information about accessing this data. |\n\n*Note: Only 1 value will appear, not a comma-delimited list, although feature_value may be a pipe-delimited list)\n"
