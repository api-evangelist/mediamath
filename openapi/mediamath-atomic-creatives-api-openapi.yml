    creative_upload_filename:
      type: array
      description: 'Creative files to upload. Send all files in a request as either `filename`

        or the legacy `filename[]` field name; do not mix both field names in the

        same request.


        Loose/non-ZIP uploads are limited to 500KB per file. Uploaded ZIP packages are

        limited to 10MB per ZIP. Direct files in the uploaded outer ZIP are limited to

        500KB. Assets inside an inner HTML5 package ZIP over 500KB are accepted with a

        warning unless the `html5-file-too-large` sub_code is promoted to an error. If

        multiple ZIP files are uploaded, ZIP structural/content validation preserves the

        legacy behavior of validating the first ZIP selected by the request.

        '
      minItems: 1
      maxItems: 10
      items:
        type: string
        format: binary
        x-allowed-extensions:
        - .gif
        - .jpg
        - .jpeg
        - .png
        - .tiff
        - .tif
        - .svg
        - .swf
        - .htm
        - .html
        - .css
        - .js
        - .woff
        - .woff2
        - .ttf
        - .otf
        - .zip
        x-max-file-size: 10485760
        x-max-zip-file-size: 10485760
        x-max-non-zip-file-size: 512000
        x-recommended-inner-html5-asset-size: 512000
        x-zip-inner-allowed-extensions:
        - .gif
        - .jpg
        - .jpeg
        - .png
        - .tiff
        - .tif
        - .svg
        - .htm
        - .html
        - .css
        - .js
        - .woff
        - .woff2
        - .ttf
        - .otf
        - .mp4
        - .webm
