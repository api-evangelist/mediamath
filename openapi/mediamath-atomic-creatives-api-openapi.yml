                  status: success
                  count: 1
    creative_validation_errors:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
          examples:
            loose_file_too_large:
              summary: Loose uploaded file over 500KB
              value:
                meta:
                  status: error
                errors:
                - code: invalid-request
                  field: /filename
                  message: file 'large_image1.jpg' exceeds maximum size of 500KB
            zip_too_large:
              summary: Uploaded ZIP over 10MB
              value:
                meta:
                  status: error
                errors:
                - code: invalid-request
                  sub_code: zip-too-large
                  field: /filename
                  message: file 'creative.zip' is 10.1MB, which exceeds the maximum zip size of 10.0MB
            direct_zip_entry_too_large:
              summary: Direct outer-ZIP entry over 500KB
              value:
                meta:
                  status: error
                errors:
                - code: invalid-request
                  sub_code: html5-file-too-large
                  field: /filename
                  message: file 'backup.png' in zip is 620KB, which exceeds the maximum file size of 500KB
            html5_multiple_violations:
              summary: HTML5 package with multiple blocking violations
              value:
                meta:
                  status: error
                errors:
                - code: invalid-request
                  sub_code: html5-missing-click-tracker
                  field: /metadata/submissions/0
                  message: No MediaMath click tracker macro was found in any HTML or JS file. Add one of [UNENCODED_CLICK_REDIRECT], [ENCODED_CLICK_REDIRECT], or [DBL_ENCODED_CLICK_REDIRECT] to your click-through URL so clicks can be tracked.
                - code: invalid-request
                  sub_code: html5-unsupported-file-type
                  field: /filename
                  message: unsupported file type '.mov' for file 'promo.mov' in zip
    error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/error_response'
