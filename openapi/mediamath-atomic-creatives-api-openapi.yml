openapi: 3.2.0
info:
  title: Campaigns Atomic Creatives API
  description: 'MediaMath Campaign Management API


    Postman Collection'
  version: 3.0.1807
  contact:
    url: https://support.infillion.com/
servers:
- url: https://api.mediamath.com/api/v3.0
  description: Live Server
security:
- Auth0:
  - offline_access
  - manage:services
tags:
- name: Atomic Creatives
  description: Atomic Creatives
paths:
  /creative_draft:
    post:
      operationId: preview-creative-assets
      summary: Preview creative assets before uploading
      description: 'Preview creative assets before permanently uploading them. The endpoint validates

        files and metadata and returns the submission shape that `/creative_upload` would

        process, without creating creatives. Creative upload limits:


        | Creative upload shape | Limit |

        | --- | --- |

        | Plain/non-ZIP uploaded files | 500KB per uploaded file |

        | Uploaded ZIP package | 10MB per ZIP file |

        | Direct files in the uploaded outer ZIP | 500KB per direct file |

        | Assets inside an inner HTML5 package ZIP | 500KB recommended maximum; warning only |

        | Uploaded filename form parts | 10 files max |


        Send all files in a request with either the `filename` multipart field name

        or the legacy `filename[]` multipart field name; do not mix both field names

        in the same request. The OpenAPI

        `x-max-file-size: 10485760` value is the transport/schema ceiling for uploaded

        ZIP parts. Non-ZIP 500KB and direct outer-ZIP file 500KB limits are endpoint

        validation rules. Assets inside an inner HTML5 package ZIP over 500KB are

        accepted with a `meta.warnings` entry unless the `html5-file-too-large` sub_code

        is promoted to an error by configuration. If multiple ZIP files are uploaded,

        ZIP structural/content validation preserves the legacy behavior of validating

        the first ZIP selected by the request. Top-level uploads may use image extensions (`.gif`, `.jpg`, `.jpeg`, `.png`,

        `.tiff`, `.tif`, `.svg`), the legacy `.swf` extension, loose HTML/CSS/JS/font

        extensions (`.html`, `.htm`, `.css`, `.js`, `.woff`, `.woff2`, `.ttf`, `.otf`),

        or ZIP packages. ZIP-inner HTML5 assets may use image extensions plus `.html`,

        `.htm`, `.css`, `.js`, `.woff`, `.woff2`, `.ttf`, `.otf`, `.mp4`, and `.webm`. HTML5 packages must use a two-level ZIP structure: the outer ZIP contains one

        or more inner ZIP files, each inner ZIP contains the HTML5 creative assets, and

        backup images are included in the outer ZIP. Loose files must not be uploaded

        alongside an HTML5 ZIP package. Nested ZIPs beyond two levels are rejected.'
      tags:
      - Atomic Creatives
      requestBody:
        $ref: '#/components/requestBodies/creative_draft'
      responses:
        '200':
          $ref: '#/components/responses/creative_draft'
        '400':
          $ref: '#/components/responses/creative_validation_errors'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
  /creative_upload:
    post:
      operationId: upload-creative-assets
      summary: Creative assets upload
      description: 'Upload creative assets and create first-party atomic creatives. This endpoint

        validates files and metadata, stores assets, and returns the atomic creatives

        that were created. Creative upload limits:


        | Creative upload shape | Limit |

        | --- | --- |

        | Plain/non-ZIP uploaded files | 500KB per uploaded file |

        | Uploaded ZIP package | 10MB per ZIP file |

        | Direct files in the uploaded outer ZIP | 500KB per direct file |

        | Assets inside an inner HTML5 package ZIP | 500KB recommended maximum; warning only |

        | Uploaded filename form parts | 10 files max |


        Send all files in a request with either the `filename` multipart field name

        or the legacy `filename[]` multipart field name; do not mix both field names

        in the same request. The OpenAPI

        `x-max-file-size: 10485760` value is the transport/schema ceiling for uploaded

        ZIP parts. Non-ZIP 500KB and direct outer-ZIP file 500KB limits are endpoint

        validation rules. Assets inside an inner HTML5 package ZIP over 500KB are

        accepted with a `meta.warnings` entry unless the `html5-file-too-large` sub_code

        is promoted to an error by configuration. If multiple ZIP files are uploaded,

        ZIP structural/content validation preserves the legacy behavior of validating

        the first ZIP selected by the request. Top-level uploads may use image extensions (`.gif`, `.jpg`, `.jpeg`, `.png`,

        `.tiff`, `.tif`, `.svg`), the legacy `.swf` extension, loose HTML/CSS/JS/font

        extensions (`.html`, `.htm`, `.css`, `.js`, `.woff`, `.woff2`, `.ttf`, `.otf`),

        or ZIP packages. ZIP-inner HTML5 assets may use image extensions plus `.html`,

        `.htm`, `.css`, `.js`, `.woff`, `.woff2`, `.ttf`, `.otf`, `.mp4`, and `.webm`. HTML5 packages must use a two-level ZIP structure: the outer ZIP contains one

        or more inner ZIP files, each inner ZIP contains the HTML5 creative assets, and

        backup images are included in the outer ZIP. Loose files must not be uploaded

        alongside an HTML5 ZIP package. Nested ZIPs beyond two levels are rejected.'
      tags:
      - Atomic Creatives
      requestBody:
        $ref: '#/components/requestBodies/creative_upload'
      responses:
        '201':
          $ref: '#/components/responses/creative_upload'
        '400':
          $ref: '#/components/responses/creative_validation_errors'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/creative_not_authorized'
  /atomic_creatives:
    get:
      operationId: list-atomic-creatives
      summary: List Atomic Creatives
      description: Get a list of atomic creatives
      tags:
      - Atomic Creatives
      parameters:
      - $ref: '#/components/parameters/extended'
      responses:
        '200':
          $ref: '#/components/responses/atomic_creative_collection'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
    post:
      summary: Create atomic creative
      description: Create an atomic creative
      tags:
      - Atomic Creatives
      operationId: post-atomic_creatives
      parameters:
      - $ref: '#/components/parameters/extended'
      responses:
        '201':
          $ref: '#/components/responses/atomic_creative'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
      requestBody:
        $ref: '#/components/requestBodies/atomic_creative_create'
  /atomic_creatives/{atomic_creative_id}:
    get:
      operationId: get-atomic-creative
      summary: Get an Atomic Creative
      description: Get an atomic creative by ID
      tags:
      - Atomic Creatives
      responses:
        '200':
          $ref: '#/components/responses/atomic_creative'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
      parameters:
      - $ref: '#/components/parameters/extended'
      - schema:
          type: integer
        name: atomic_creative_id
        in: path
        required: true
        description: Numeric ID of the atomic creative to get
    post:
      summary: Update an atomic creative
      description: Update an atomic creative by ID
      tags:
      - Atomic Creatives
      operationId: post-atomic_creatives-atomic_creative_id
      responses:
        '200':
          $ref: '#/components/responses/atomic_creative'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
        '409':
          $ref: '#/components/responses/error'
      requestBody:
        $ref: '#/components/requestBodies/atomic_creative_update'
      parameters:
      - $ref: '#/components/parameters/extended'
      - schema:
          type: integer
        name: atomic_creative_id
        in: path
        required: true
        description: Numeric ID of the atomic creative to update
  /atomic_creatives/{atomic_creative_id}/history:
    get:
      operationId: atomic-creative-audit-log
      summary: Atomic Creative Audit Log
      description: Get a list changes to this atomic creative
      tags:
      - Atomic Creatives
      parameters:
      - $ref: '#/components/parameters/page_limit'
      - $ref: '#/components/parameters/page_offset'
      - in: path
        name: atomic_creative_id
        schema:
          type: integer
        required: true
        description: Numeric ID of the atomic creative
      responses:
        '200':
          $ref: '#/components/responses/audit_log'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
  /atomic_creatives/healthcheck:
    get:
      operationId: atomic-creatives-healthcheck
      summary: Healthcheck for Atomic Creatives
      description: Endpoint to check the health of atomic creatives by ID(s).
      tags:
      - Atomic Creatives
      parameters:
      - name: q
        in: query
        description: 'Query parameter to specify the atomic creative ID(s).

          Format:

          - For multiple IDs: `atomic_creative_id==(id1, id2)`

          - For a single ID: `atomic_creative_id==id`

          '
        required: true
        schema:
          type: string
        examples:
          single:
            summary: Single ID
            value: atomic_creative_id==11884513
          multiple:
            summary: Multiple IDs
            value: atomic_creative_id==(11884513, 11884508)
      responses:
        '200':
          $ref: '#/components/responses/atomic_creative_healthcheck'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
        '404':
          $ref: '#/components/responses/error'
  /bulk_update/atomic_creatives:
    post:
      operationId: bulk-update-atomic-creatives
      summary: Bulk Update Atomic Creatives
      description: Update multiple atomic creatives
      tags:
      - Atomic Creatives
      parameters:
      - $ref: '#/components/parameters/extended'
      responses:
        '200':
          $ref: '#/components/responses/atomic_creative_bulk'
        '207':
          $ref: '#/components/responses/atomic_creative_bulk'
        '400':
          $ref: '#/components/responses/error'
        '401':
          $ref: '#/components/responses/error'
        '403':
          $ref: '#/components/responses/error'
      requestBody:
        $ref: '#/components/requestBodies/atomic_creative_bulk'
components:
  schemas:
    creative_collection_created_metadata:
      type: object
      properties:
        status:
          type: string
          example: success
        count:
          type: integer
          example: 1
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/creative_warning'
      required:
      - status
      - count
    creative_asset_submission_draft:
      type: object
      required:
      - name
      - click_through_url
      properties:
        name:
          type: string
          example: banner_300x250.jpg
          description: 'The creative file name. For loose/non-ZIP uploads this is the uploaded

            filename. For regular ZIPs this is a file inside the ZIP. For HTML5

            packages this is the inner ZIP filename, such as `interactive_ad.zip`.

            '
        click_through_url:
          type: string
          format: uri
          example: https://example.com/click
        landing_page:
          type: string
          format: uri
          example: https://example.com/landing
        concept_id:
          type: integer
          format: int32
          minimum: 1
          example: 123
        backup:
          type: string
          example: backup_image.jpg
          description: 'Optional backup image filename for HTML5 creatives. Backup images must be

            inside the HTML5 ZIP package. If omitted, the API attempts to find an

            image with the same base filename as the HTML5 package.

            '
        mraid_type:
          type: string
          enum:
          - static
          - expandable
          - interstitial
          description: 'Optional MRAID type. `expandable` requires the `expandable` image field;

            `expandable` must not be supplied for other MRAID types.

            '
        expandable:
          type: string
          example: expandable_image.jpg
          description: Required when `mraid_type` is `expandable`; otherwise invalid.
    creative_draft_request:
      type: object
      required:
      - filename
      - metadata
      properties:
        filename:
          $ref: '#/components/schemas/creative_upload_filename'
        metadata:
          $ref: '#/components/schemas/creative_upload_metadata_draft'
    atomic_creative_response_extended:
      title: atomic_creative_response_extended
      type: object
      properties:
        id:
          type: integer
        version:
          type: integer
        entity_type:
          type: string
        advertiser_id:
          type: integer
        advertiser_name:
          type: string
          description: available only when extended
        concept_id:
          type: integer
        concept_name:
          type: string
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        creative_import_file_id:
          type: integer
        file_type:
          type: string
        is_https:
          type: boolean
        is_multi_creative:
          type: boolean
        has_sound:
          type: boolean
        rich_media:
          type: boolean
        rich_media_provider:
          type: string
        status:
          type: boolean
        archived:
          type: boolean
        built:
          type: boolean
        build_date:
          type: string
        built_by_user_id:
          type:
          - integer
          - 'null'
        build_errors:
          type: string
        created_on:
          type: string
          format: date-time
          readOnly: true
        last_modified:
          type: string
        external_identifier:
          type: string
        tpas_ad_tag_name:
          type: string
        updated_on:
          type: string
          format: date-time
          readOnly: true
        expand:
          type: string
        click_url:
          type: string
        ad_format:
          type: string
        expansion_direction:
          type: string
          maxLength: 19
          default: NONRESTRICTED
        expansion_trigger:
          type: string
          enum:
          - AUTOMATIC
          - MOUSEOVER
          - CLICK
          default: MOUSEOVER
        ad_server_type:
          type: string
        t1as:
          type: boolean
        tpas_ad_tag:
          type: string
        edited_tag:
          type: string
        click_through_url:
          type: string
        rejected_reason:
          type: string
        approval_status:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        media_type:
          type: string
        is_mraid:
          type: boolean
        vast_version:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 9.9
        sizmek_tag_status:
          type: string
        sizmek_creative_status:
          type: string
        last_payload_modified:
          type: string
        is_audio:
          type: boolean
        tag:
          type: string
        tag_type:
          type: string
        targeted_strategies:
          type: object
          description: available only when extended
          properties:
            count:
              type: integer
            strategies_list:
              type: array
              items:
                type: integer
                format: int32
        atomic_creative_ssl_validators:
          type: object
          description: available only when extended
          properties:
            is_https:
              type: string
            notify_state:
              type: string
            ignored:
              type: string
            ksize:
              type: integer
        vendors:
          type: array
          description: available only when extended
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              adx_approved:
                type: boolean
              adx_declaration_required:
                type: boolean
              mm_contract_available:
                type: boolean
              is_eligible:
                type: boolean
              adx_ssl_approved:
                type: boolean
              adx_video_ssl_approved:
                type: boolean
              adx_video_approved:
                type: boolean
              auto_tag_display:
                type: boolean
              set_by:
                type: string
              detect_domains:
                type: array
                items:
                  type: string
        creative_assets:
          type: array
          description: available only when extended
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              version:
                type: integer
              creative_id:
                type: integer
              primary_asset_id:
                type: integer
              created_on:
                type: string
                format: date-time
                readOnly: true
              updated_on:
                type: string
                format: date-time
                readOnly: true
              file_name:
                type: string
              file_role:
                type: string
              file_type:
                type: string
              file_storage_path:
                type: string
              file_size:
                type: integer
              media_version:
                type: number
                format: float
              width:
                type: integer
              height:
                type: integer
              note:
                type: string
        inner_tag:
          type: string
          description: available only when extended. Contains the original inner tag content for HTML5 creatives.
      required:
      - id
      - version
      - entity_type
      - advertiser_id
      - name
      - width
      - height
      - file_type
      - is_https
      - is_multi_creative
      - has_sound
      - rich_media
      - built
      - built_by_user_id
      - created_on
      - last_modified
      - tpas_ad_tag_name
      - updated_on
      - ad_format
      - expansion_trigger
      - expansion_direction
      - t1as
      - approval_status
      - media_type
      - is_mraid
      - sizmek_tag_status
      - sizmek_creative_status
    atomic_creative_response:
      title: atomic_creative_response
      type: object
      properties:
        id:
          type: integer
        version:
          type: integer
        entity_type:
          type: string
        advertiser_id:
          type: integer
        concept_id:
          type: integer
        concept_name:
          type: string
        name:
          type: string
        width:
          type: integer
        height:
          type: integer
        creative_import_file_id:
          type: integer
        file_type:
          type: string
        is_https:
          type: boolean
        is_multi_creative:
          type: boolean
        has_sound:
          type: boolean
        rich_media:
          type: boolean
        rich_media_provider:
          type: string
        status:
          type: boolean
        archived:
          type: boolean
        built:
          type: boolean
        build_date:
          type: string
        built_by_user_id:
          type:
          - integer
          - 'null'
        build_errors:
          type: string
        created_on:
          type: string
          format: date-time
          readOnly: true
        last_modified:
          type: string
        external_identifier:
          type: string
        tpas_ad_tag_name:
          type: string
        updated_on:
          type: string
          format: date-time
          readOnly: true
        expand:
          type: string
        click_url:
          type: string
        ad_format:
          type: string
        expansion_direction:
          type: string
          maxLength: 19
          default: NONRESTRICTED
        expansion_trigger:
          type: string
          enum:
          - AUTOMATIC
          - MOUSEOVER
          - CLICK
          default: MOUSEOVER
        ad_server_type:
          type: string
        t1as:
          type: boolean
        tpas_ad_tag:
          type: string
        edited_tag:
          type: string
        click_through_url:
          type: string
        rejected_reason:
          type: string
        approval_status:
          type: string
        start_date:
          type: string
        end_date:
          type: string
        media_type:
          type: string
        is_mraid:
          type: boolean
        vast_version:
          type:
          - number
          - 'null'
          format: float
          minimum: 0
          maximum: 9.9
        sizmek_tag_status:
          type: string
        sizmek_creative_status:
          type: string
        last_payload_modified:
          type: string
        is_audio:
          type: boolean
        tag:
          type: string
        tag_type:
          type: string
      required:
      - id
      - version
      - entity_type
      - advertiser_id
      - name
      - width
      - height
      - file_type
      - is_https
      - is_multi_creative
      - has_sound
      - rich_media
      - built
      - created_on
      - last_modified
      - tpas_ad_tag_name
      - updated_on
      - ad_format
      - expansion_trigger
      - expansion_direction
      - t1as
      - approval_status
      - media_type
      - is_mraid
      - sizmek_tag_status
      - sizmek_creative_status
    atomic_creative_healthcheck_response:
      title: atomic_creative_healthcheck_response
      type: object
      properties:
        atomic_creative_id:
          type: integer
          description: ID of the atomic creative.
        creative_name:
          type: string
          description: Name of the atomic creative.
        advertiser_id:
          type: integer
          description: ID of the advertiser the creative belongs to.
        advertiser_name:
          type: string
          description: Name of the advertiser the creative belongs to.
        entity_type:
          type: string
          description: Always `creative_healthcheck`.
        net_status:
          type: string
          description: Overall status across all exchanges. `REJECTED` if any exchange rejected the creative, otherwise the most severe pending state across exchanges. `N/A` when the creative has no approval records on any exchange.
          enum:
          - APPROVED
          - REJECTED
          - PENDING
          - PENDING > 48 Hours
          - N/A
        adx_open_auction:
          type: string
          description: Approval status on Google AdX (open auction). `N/A` when no approval record exists; a `PENDING` status becomes `PENDING > 48 Hours` when unchanged for more than 48 hours.
        adx_deals:
          type: string
          description: Approval status on Google AdX (deals). Same values as `adx_open_auction`.
        app_nexus:
          type: string
          description: Approval status on AppNexus (Xandr). Same values as `adx_open_auction`.
        microsoft_ad_exchange:
          type: string
          description: Approval status on Microsoft Ad Exchange. Same values as `adx_open_auction`.
        right_media_exchange:
          type: string
          description: Approval status on Right Media Exchange. Same values as `adx_open_auction`.
        brightroll_for_display:
          type: string
          description: Approval status on BrightRoll for Display. Same values as `adx_open_auction`.
        mopub_direct:
          type: string
          description: Approval status on MoPub Direct. Same values as `adx_open_auction`.
        freakout:
          type: string
          description: Approval status on FreakOut. Same values as `adx_open_auction`.
        freewheel:
          type: string
          description: Approval status on FreeWheel. Same values as `adx_open_auction`.
        adx_open_auction_rejected_reason:
          type: string
          description: Reason the creative was rejected on Google AdX (open auction). Only present when `adx_open_auction` is `REJECTED`.
        adx_deals_rejected_reason:
          type: string
          description: Reason the creative was rejected on Google AdX (deals). Only present when `adx_deals` is `REJECTED`.
        app_nexus_rejected_reason:
          type: string
          description: Reason the creative was rejected on AppNexus (Xandr). Only present when `app_nexus` is `REJECTED`.
        microsoft_ad_exchange_rejected_reason:
          type: string
          description: Reason the creative was rejected on Microsoft Ad Exchange. Only present when `microsoft_ad_exchange` is `REJECTED`.
        right_media_exchange_rejected_reason:
          type: string
          description: Reason the creative was rejected on Right Media Exchange. Only present when `right_media_exchange` is `REJECTED`.
        brightroll_for_display_rejected_reason:
          type: string
          description: Reason the creative was rejected on BrightRoll for Display. Only present when `brightroll_for_display` is `REJECTED`.
        mopub_direct_rejected_reason:
          type: string
          description: Reason the creative was rejected on MoPub Direct. Only present when `mopub_direct` is `REJECTED`.
        freakout_rejected_reason:
          type: string
          description: Reason the creative was rejected on FreakOut. Only present when `freakout` is `REJECTED`.
        freewheel_rejected_reason:
          type: string
          description: Reason the creative was rejected on FreeWheel. Only present when `freewheel` is `REJECTED`.
    atomic_creative_create:
      title: atomic_creative_create
      type: object
      properties:
        width:
          type: integer
          format: int32
          example: 80
        name:
          type: string
          minLength: 1
          maxLength: 256
        height:
