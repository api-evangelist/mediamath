      description: Preview generated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/creative_draft_response_data'
              meta:
                $ref: '#/components/schemas/creative_single_metadata_with_warnings'
          examples:
            single_image:
              summary: Single image preview
              value:
                data:
                  uploaded_files:
                  - name: banner_300x250.jpg
                  metadata:
                    advertiser_id: 100212
                    is_https: true
                    submissions:
                    - name: banner_300x250.jpg
                      landing_page: https://example.com/landing
                      click_through_url: https://example.com/click
                      concept_id: 4157184
                meta:
                  status: success
            html5_creative_with_warnings:
              summary: HTML5 creative preview with non-blocking warnings
              value:
                data:
                  uploaded_files:
                  - name: interactive_ad.zip
                  metadata:
                    advertiser_id: 100212
                    is_https: true
                    submissions:
                    - name: interactive_ad.zip
                      landing_page: https://brand.example.com/products
                      click_through_url: https://brand.example.com/click
                      concept_id: 3001
                meta:
                  status: success
                  warnings:
                  - code: warning
                    sub_code: html5-noscript-tag
                    field: /metadata/submissions/0
                    message: The root HTML document 'index.html' contains a <noscript> tag, which is not recommended in HTML5 asset packages. Consider removing the <noscript> tag and its contents.
                  - code: warning
                    sub_code: html5-file-too-large
                    field: /metadata/submissions/0
                    message: file 'hero.png' in zip is 620KB, which exceeds the recommended maximum file size of 500KB, and was accepted as-is. Consider compressing it to keep the creative light.
