    get:
      operationId: GET_report
      summary: Report Data
      tags:
      - Data Retrieval
      description: '{% admonition type="danger" name="This API is deprecated and will be removed in July 2026" %}

        The new API docs can be found here: https://apidocs.mediamath.com/apis/reporting-api

        {% /admonition %}


        # Parameters


        Parameter names are case sensitive, (see the table below). Most parameters will fall under one of the following two formats. * enumeration of comma-separated items (used in aggregation, selection and sorting);

        * example:

        * `dimensions=campaign_id%2Ccampaign_name%2Ccampaign_start_date` (in other words, `campaign_id,campaign_name,campaign_start_date`)

        * list of logically AND-ed expressions, joined by ampersand (used in dimension and metric filtering);

        * examples:

        * `filter=campaign_id%3D12345%26strategy_id%3D98765` (in other words, `campaign_id=12345&strategy_id=98765`)

        * `having=impressions%3E%3D500%26clicks%3C100` (in other words, `impressions>=500&clicks section. For more information about the `filter` and `having` parameters see the following section. #### Predicate Parameters


        `filter` and `having` are predicate parameters. One of the two parameters is required. The parameters consist of one or more predicates. A predicate has the following format. 1. a dimension or metric field from the report definition

        2. an operator from the _Operators supported in filtering expressions_ table

        3. one or more values matching the type of field


        At least one predicate parameters is required. This is because at least one of the predicates must use one of the access dimension fields in an equality test (operator `=`). The `filter` parameter filters on dimension fields only, while the `having` parameter may filter by both dimension and metric fields. The `filter` parameter is applied before rows are grouped, while the `having` parameter is applied after rows have been grouped, and metrics have been calculated. The parameter `filter` is not required if access dimension fields are used in parameter `having`. Using dimension fields in the `having` parameter causes those dimension fields to be used in grouping rows. ##### Operators supported in filtering expressions


        |Operators|Operation|Field Data Type|

        |--- |--- |--- |

        |=, !=|equality, non-equality check|all|

        |>, =, =500&clicks = ~ ! :


        The encoding is a simple two step process. 1. Double quotes are doubled. 2. The resultant value is surrounded in double quotes. The following shows an example. * Unencoded: Jack & Jill "Of All Trades"

        * Encoded: "Jack & Jill ""Of All Trades"""


        This special encoding may be applied to any value in the predicates. It does not determine the type. The looseness is there to allow for URLs to be more readable. It does however, need to be applied before URL encoding is performed. ### Aggregation


        Through the `dimensions`, one can indicate the way the rows must be grouped. One or more dimension fields, may be specified. The order in which the dimension fields are listed is important for the result set. ```

        ### group by these fields in this order dimensions=campaign_id%2Ccampaign_name%2Ccampaign_start_date

        ### (i.e. campaign_id,campaign_name,campaign_start_date)

        ```


        See the Time Field section of the for grouping options available for the time field. Grouping by metric fields is not allowed. Metric fields are calculated based on the underlying rows of each group. The metrics can be chosen via the `metrics` parameter. ```

        ### calculate these metrics per group dimensions=clicks%2Cimpressions

        ### (i.e. clicks,impressions)

        ```


        # On Success


        The system returns an appropriate HTTP return code (2xx or 3xx - see RFC 2616). The response body is CSV-formatted (`Content-Type: text/csv`), consisting of one header row, and zero or more data rows. The response uses the HTTP 1.1 chunking feature. A data row will represent a group. It will have a start_date/end_date format, or an interval format. Always use the header line to determine the order of columns, as they may not match the order listed in the parameters.'
      parameters:
      - $ref: '#/components/parameters/trait_cookieAuth_Cookie'
