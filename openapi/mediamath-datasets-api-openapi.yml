openapi: 3.2.0
info:
  contact:
    email: developers@mediamath.com
    name: Support
    url: https://mediamathsupport.force.com/
  description: 'OpenAPI 3.0 spec of the Reporting API.


    > ### Beta datasets

    >

    > Datasets marked as **(beta)** are subject to change or removal without prior notice, and are offered as is with no support.'
  title: Reporting API V2 Datasets API
  version: 1.0.0
servers:
- description: Live Server
  url: https://api.mediamath.com/reporting/v2
security:
- Auth0:
  - offline_access
tags:
- name: Datasets
paths:
  /all-dimensions-and-metrics:
    post:
      description: Standard performance metrics in campaign currency and broken out by our widest array of dimensions.
      requestBody:
        content:
          application/json:
            example:
              fields:
              - campaign_id
              - impressions
              filters:
              - field: organization_id
                op: '='
                value: 123456
              - field: agency_id
                value:
                - 123456
                - 789012
              - field: advertiser_id
                value: 123456
              - field: campaign_name
                op: =~
                value: Test Campaign
              order:
              - desc: false
                field: agg_timestamp
                nulls_last: true
              pagination:
                page_index: 0
                page_size: 100
              rollup: by_day
              time_window: current_day
            schema:
              oneOf:
              - required:
                - time_window
                title: Time Window
              - required:
                - start_time
                title: Date Range
              properties:
                end_time:
                  format: date-time
                  type:
                  - string
                  - 'null'
                fields:
                  items:
                    type: string
                  minItems: 1
                  type: array
                  uniqueItems: true
                filters:
                  items:
                    properties:
                      field:
                        type: string
                      filters:
                        items:
                          properties:
                            field:
                              type: string
                            filters:
                              description: An array of filters. Required if `op` is `and` or `or`.
                              items:
                                type: object
                              type: array
                            op:
                              default: '='
                              description: '* `=`: Equals or contains if `value` is an array

                                * `!=`: Not equals

                                * `>`: Greater than

                                * `>=`: Greater than or equals

                                * `<`: Less than

                                * `<=`: Less than or equals

                                * `=~`: Text contains (case-insensitive)

                                * `and`: All filters must match

                                * `or`: At least one filter must match

                                * `isNull`: Is null

                                * `isNotNull`: Is not null'
                              type: string
                            value:
                              anyOf:
                              - anyOf:
                                - type: integer
                                - type: number
                                - type: string
                                - type: boolean
                              - items:
                                  anyOf:
                                  - type: integer
                                  - type: number
                                  - type: string
                                  - type: boolean
                                type: array
                          type: object
                        minItems: 2
                        type:
                        - array
                        - 'null'
                      op:
                        default: '='
                        description: '* `=`: Equals or contains if `value` is an array

                          * `!=`: Not equals

                          * `>`: Greater than

                          * `>=`: Greater than or equals

                          * `<`: Less than

                          * `<=`: Less than or equals

                          * `=~`: Text contains (case-insensitive)

                          * `and`: All filters must match

                          * `or`: At least one filter must match

                          * `isNull`: Is null

                          * `isNotNull`: Is not null'
                        type: string
                      value:
                        anyOf:
                        - anyOf:
                          - type: integer
                          - type: number
                          - type: string
                          - type: boolean
                        - items:
                            anyOf:
                            - type: integer
                            - type: number
                            - type: string
                            - type: boolean
                          type: array
                    type: object
                  minItems: 1
                  type: array
                full_entities:
                  items:
                    type: string
                  minItems: 1
                  type:
                  - array
                  - 'null'
                  uniqueItems: true
                max_results:
                  description: Maximum number of results to return. Only applicable for streaming responses. No limit if absent or `null`.
                  minimum: 1
                  type:
                  - integer
                  - 'null'
                order:
                  items:
                    properties:
                      desc:
                        default: false
                        type: boolean
                      field:
                        type: string
                      nulls_last:
                        default: false
                        type: boolean
                    required:
                    - field
                    type: object
                  type: array
                pagination:
                  description: Streaming response if absent or `null`, Paginated response otherwise
                  properties:
                    page_index:
                      minimum: 0
                      type: integer
                    page_size:
                      maximum: 10000
                      minimum: 1
                      type: integer
                  type:
                  - object
                  - 'null'
                rollup:
                  type: string
                start_time:
                  format: date-time
                  type: string
                time_window:
                  type: string
                time_zone:
                  description: '**Only in supported datasets:** `campaign`, `UTC` or a time zone name defined in https://www.iana.org/time-zones'
                  type: string
              required:
              - fields
              - filters
              - rollup
        required: true
      responses:
        '200':
          content:
            application/json:
              example:
                meta:
                  items_count: 3
                  page_index: 0
                  status: OK
                  total_items_count: 3
                  total_pages: 1
                results:
                - agg_timestamp: '2023-07-27T12:00:00Z'
                  campaign_id: 1
                  impressions: 93283
                - agg_timestamp: '2023-07-27T12:00:00Z'
                  campaign_id: 2
                  impressions: 474
                - agg_timestamp: '2023-07-27T12:00:00Z'
                  campaign_id: 3
                  impressions: 45775
              schema:
                properties:
                  meta:
                    properties:
                      items_count:
                        minimum: 0
                        type: integer
                      page_index:
                        minimum: 0
                        type: integer
                      status:
                        enum:
                        - OK
                        type: string
                      total_items_count:
                        minimum: 0
                        type: integer
                      total_pages:
                        minimum: 0
                        type: integer
                    type: object
                  results:
                    items:
                      type: object
                    type: array
                type: object
            application/jsonl:
              schema:
                $ref: '#/components/schemas/StreamingResponse'
          description: JSON for Paginated, JSONL for Streaming
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: The request is not valid
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized
        5XX:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: An error occurred
      summary: All Dimensions and Metrics
      tags:
      - Datasets
      operationId: postAllDimensionsAndMetrics
      x-operation-id-source: derived
