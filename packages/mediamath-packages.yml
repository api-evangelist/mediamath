    source_code: https://github.com/MediaMath/ios-sdk
    note: >-
      Mobile Pixel SDK for Apple iOS, documented at
      https://apidocs.mediamath.com/guides/mobile-pixel-sdk. Distributed as a
      GitHub repository only — no CocoaPods, Swift Package Manager or Carthage
