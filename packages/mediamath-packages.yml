generated: '2026-08-13'
method: searched
source: https://pypi.org/project/terminalone/, https://www.npmjs.com/package/@mediamath/terminalone,
  https://packagist.org/packages/mediamath/t1-php, https://github.com/MediaMath
note: >-
  MediaMath's first-party client libraries were all published under the legacy
  "TerminalOne" (T1) platform brand. Every one of them is stale relative to the
  APIs it wraps: the Campaign Management API is on v3.0.1807 and the Reporting
  API V2 shipped after all of these releases. The Python package is the only one
  released in the last five years, and its GitHub source repository
  (MediaMath/t1-python) now returns 404 while the PyPI distribution remains
  published — a package a consumer can still install from a repository that no
  longer exists. No first-party SDK exists for the Marketplaces, BYOA, Component
  Creatives, Video Creatives or Audience Segments APIs, and none exists for the
  Infillion Agent Connector (MCP).
packages:
  - language: python
    registry: pypi
    name: terminalone
    url: https://pypi.org/project/terminalone/
    install: pip install terminalone
    official: true
    version: 1.9.20
    published: '2024-03-13'
    source_code: https://github.com/MediaMath/t1-python
    note: >-
      "A package for interacting with MediaMath's TerminalOne API."
      home_page on PyPI is http://www.mediamath.com. The declared GitHub source
      repository https://github.com/MediaMath/t1-python returned HTTP 404 when
      probed on 2026-08-13; the PyPI distribution is still published and
      installable.

  - language: javascript
    registry: npm
    name: "@mediamath/terminalone"
    url: https://www.npmjs.com/package/@mediamath/terminalone
