    published: '2018-05-17'
    source_code: https://github.com/MediaMath/t1-node
    note: >-
      "Connection Module for T1 API written in node.js", published under the
      vendor-controlled @mediamath npm scope. Last release 2018-05-17. The
      declared source repository https://github.com/MediaMath/t1-node returned
      HTTP 404 when probed on 2026-08-13.

  - language: php
