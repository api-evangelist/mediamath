    version: 1.0.6
    published: '2017-08-15'
    source_code: https://github.com/MediaMath/t1-php
    note: >-
      "PHP SDK for MediaMath Platform APIs". Source repo is live but its last
      push was 2017-08-15, matching the last Packagist release. 7,661 total
      downloads.

  - language: javascript
    registry: npm
    name: "@mediamath/t1proxy"
    url: https://www.npmjs.com/package/@mediamath/t1proxy
    install: npm install @mediamath/t1proxy
    official: true
    version: 1.0.8
    published: '2017-10-06'
    source_code: https://github.com/conoverm/t1proxy
    note: >-
      Development proxy to the T1 APIs using http-proxy-middleware. Published
      under the vendor-controlled @mediamath npm scope, but the declared
      repository is a personal account (conoverm/t1proxy), so first-party status
      rests on the npm scope alone. A dev tool, not a client library.

  - language: swift
    registry: null
